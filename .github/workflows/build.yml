name: Build ImmortalWrt AX3000T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison \
            gcc-multilib g++-multilib gettext \
            libncurses-dev libssl-dev python3 \
            rsync unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure AX3000T
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_xiaomi_router-ax3000t=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-firewall=y

          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          EOF
          make defconfig

      - name: Download packages
        working-directory: immortalwrt
        run: |
          make download -j8

      - name: Build Firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Xiaomi-AX3000T
          path: immortalwrt/bin/targets/mediatek/mt7981/
